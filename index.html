<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS 엘에스 · 피겨 의상 대여</title>
<meta name="description" content="Love ur Skating - 피겨스케이팅 공연·시합 의상 대여">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#"><img src="assets/logo.jpg" alt="LS 로고"><span>Love ur Skating</span></a>
    <a class="btn small" id="callTop" href="#">전화 문의</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>피겨 의상, 편하게 빌리세요</h1>
    <p>공연과 시합에 어울리는 의상을 대여해 드립니다.<br>마음에 드는 드레스를 고르고 바로 문의해 주세요.</p>
  </div>
</section>

<main class="wrap">
  <div class="filters" aria-label="필터">
    <div class="chips" id="statusChips"></div>
    <div class="selects">
      <select id="sizeSel" aria-label="사이즈"><option value="">사이즈 전체</option></select>
      <select id="colorSel" aria-label="색상"><option value="">색상 전체</option></select>
    </div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>조건에 맞는 드레스가 없어요.</p>
</main>

<section class="how wrap">
  <h2>대여 방법</h2>
  <ol>
    <li>마음에 드는 드레스를 고릅니다.</li>
    <li>전화 또는 인스타그램으로 날짜와 함께 문의합니다.</li>
    <li>예약 확정 후 수령·반납 방법을 안내해 드려요.</li>
  </ol>
</section>

<footer>
  <div class="wrap">
    <p><strong>LS (엘에스)</strong> · Love ur Skating</p>
    <p id="hours"></p>
    <p><a id="callFoot" href="#"></a> · <a id="igFoot" target="_blank" rel="noopener" href="#"></a></p>
  </div>
</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="close" id="close" aria-label="닫기">×</button>
    <div class="ph" id="mPhoto"></div>
    <div class="info">
      <h3 id="mName"></h3>
      <span class="badge" id="mBadge"></span>
      <dl id="mDetails"></dl>
      <div class="actions">
        <a class="btn" id="mCall" href="#">전화로 예약 문의</a>
        <a class="btn ghost" id="mIg" target="_blank" rel="noopener" href="#">인스타그램 DM</a>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
